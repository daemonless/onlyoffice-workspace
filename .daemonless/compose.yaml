# CIT test compose file
name: onlyoffice-workspace-test

services:
  mariadb:
    image: ghcr.io/daemonless/mariadb:latest
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: "rootpassword"
      MYSQL_DATABASE: "onlyoffice"
      MYSQL_USER: "onlyoffice"
      MYSQL_PASSWORD: "testpassword"

  onlyoffice-workspace:
    image: ghcr.io/daemonless/onlyoffice-workspace:build
    network_mode: host
    annotations:
      org.freebsd.jail.allow.mlock: "true"
    environment:
      HTTP_PORT: "8080"
      MYSQL_SERVER_HOST: "127.0.0.1"
      MYSQL_SERVER_PORT: "3306"
      MYSQL_SERVER_DB_NAME: "onlyoffice"
      MYSQL_SERVER_USER: "onlyoffice"
      MYSQL_SERVER_PASS: "testpassword"
      MYSQL_SERVER_ROOT_PASS: "rootpassword"
    depends_on:
      - mariadb
